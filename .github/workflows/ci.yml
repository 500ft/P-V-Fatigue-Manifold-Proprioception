name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest reportlab pypdf
      - name: Run tests
        run: python -m pytest
      - name: Check manuscript numbers
        run: python -m scripts.check_manuscript_numbers
      - name: arXiv PDF pre-flight (fonts embedded, no encryption/JS)
        run: python -m scripts.check_pdf_arxiv
